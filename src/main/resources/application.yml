spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/payments
    username: payments
    password: payments
  jpa:
    hibernate:
      # update = Hibernate creates/updates tables from the entities on startup.
      # Convenient for learning; in production use migrations instead (Flyway).
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

server:
  port: 8080
