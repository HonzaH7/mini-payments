spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/payments
    username: ${POSTGRES_USER:payments}
    password: ${POSTGRES_PASSWORD:payments}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  rabbitmq:
    host: localhost
    port: 5672
    username: ${RABBITMQ_USER:payments}
    password: ${RABBITMQ_PASSWORD:payments}
    listener:
      simple:
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 2s

server:
  port: 8080

logging:
  pattern:
    level: "%5p [%X{correlationId:-}]"