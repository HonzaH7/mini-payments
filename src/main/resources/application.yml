spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/payments
    username: payments
    password: payments
  jpa:
    hibernate:
      # update = Hibernate creates/updates tables from the entities on startup.
      # Convenient for learning; in production use migrations instead (Flyway).
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  rabbitmq:
    host: localhost
    port: 5672
    username: payments
    password: payments
    listener:
      simple:
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 2s

server:
  port: 8080

logging:
  pattern:
    level: "%5p [%X{correlationId:-}]"